name: Build & release

# Elke push naar main: bouwen voor Windows x64 en Linux x64.
# Tag v* (bijv. v0.1.0): ook een GitHub release met de zips.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: write           # nodig om release-assets te uploaden

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Eigen installatiemap: niet mengen met een voorgeïnstalleerde nieuwere SDK
      - uses: actions/setup-dotnet@v4
        id: dotnet
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: SDK vastzetten op .NET 10
        shell: bash
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --force

      - name: Versie bepalen
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # ── Hamlib (rigctld) ──────────────────────────────────────────────
      # Windows: officiële Hamlib w64 zip uit de nieuwste Hamlib release,
      # inhoud van bin\ → hamlib\win-x64\ (wordt meegeleverd in de zips).
      - name: Hamlib ophalen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo Hamlib/Hamlib --pattern 'hamlib-w64-*.zip' --dir hamlib-dl
          $zip = Get-ChildItem hamlib-dl -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "Geen hamlib-w64 zip gevonden in de Hamlib release" }
          Expand-Archive $zip.FullName -DestinationPath hamlib-dl/x
          $root = Get-ChildItem hamlib-dl/x -Directory | Select-Object -First 1
          $dst = New-Item -ItemType Directory -Force hamlib/win-x64
          Copy-Item "$($root.FullName)/bin/rigctld.exe", "$($root.FullName)/bin/rigctl.exe" $dst
          Copy-Item "$($root.FullName)/bin/*.dll" $dst
          # Licentie en readme meeleveren (Hamlib is LGPL)
          Get-ChildItem $root.FullName -Recurse -File | Where-Object { $_.Name -match '^(COPYING|LICENSE|README)' } | Copy-Item -Destination $dst
          if (-not (Test-Path "$dst/rigctld.exe")) { throw "rigctld.exe ontbreekt" }
          & "$dst/rigctld.exe" --version
          "BOLTCAT_RIGCTLD=$((Resolve-Path "$dst/rigctld.exe").Path)" >> $env:GITHUB_ENV
          "Hamlib: $($zip.Name)" >> $env:GITHUB_STEP_SUMMARY

      # Linux: rigctld van het systeem (alleen voor de integratietests)
      - name: Hamlib installeren (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libhamlib-utils
          rigctld --version

      - name: Build
        run: dotnet build BoltCatControl.slnx -c Release

      - name: Tests
        env:
          BOLTCAT_REQUIRE_RIGCTLD: "1"   # integratietest met echte rigctld is verplicht in CI
          BOLTCAT_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: dotnet test BoltCatControl.slnx -c Release --no-build --logger "console;verbosity=normal"

      # GUI screenshots (headless gerenderd) om de layout te bekijken
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.rid }}
          path: screenshots/*.png
          if-no-files-found: ignore

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/BoltCatControl -r ${{ matrix.rid }} --self-contained
          -c Release -o out/BoltCatControl
          /p:Version=${{ steps.ver.outputs.version }}

      # Testprogramma als één losse exe (geen SDK nodig om te testen)
      - name: Publish BoltCat.Test ${{ matrix.rid }}
        run: >
          dotnet publish tools/BoltCat.Test -r ${{ matrix.rid }} --self-contained
          -c Release -o out/BoltCat.Test
          /p:PublishSingleFile=true /p:Version=${{ steps.ver.outputs.version }}

      - name: Zippen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path out/BoltCatControl -DestinationPath "BoltCatControl-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.zip"
          if (-not (Test-Path out/BoltCatControl/hamlib/rigctld.exe)) { throw "hamlib/rigctld.exe ontbreekt in BoltCatControl" }
          if (-not (Test-Path out/BoltCat.Test/hamlib/rigctld.exe))  { throw "hamlib/rigctld.exe ontbreekt in BoltCat.Test" }
          Compress-Archive -Path out/BoltCat.Test -DestinationPath "BoltCat.Test-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.zip"

      - name: Zippen (Linux, met execute-bit)
        if: runner.os == 'Linux'
        run: |
          chmod +x out/BoltCatControl/BoltCatControl out/BoltCat.Test/BoltCat.Test
          cd out
          zip -qr "../BoltCatControl-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.zip" BoltCatControl
          zip -qr "../BoltCat.Test-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.zip" BoltCat.Test

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: BoltCat*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: GitHub release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "BoltCatControl $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber BoltCat*.zip
